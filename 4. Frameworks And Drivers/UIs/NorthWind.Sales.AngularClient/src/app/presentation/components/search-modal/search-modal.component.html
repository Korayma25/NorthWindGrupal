@if (visible()) {
  <div
    class="modal d-block fade show"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    style="background-color: rgba(11, 15, 26, 0.75);"
    (keydown)="handleKeyDown($event)"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content shadow border-0 search-modal-content">
        <div class="modal-header bg-navy text-white">
          <h5 class="modal-title fw-bold">{{ title() }}</h5>
          <button
            type="button"
            class="btn-close btn-close-white"
            aria-label="Close"
            (click)="closeModal()"
          ></button>
        </div>
        <div class="modal-body">
          <div class="row g-2 align-items-end mb-3">
            <div class="col" (input)="handleFilterInput()">
              <ng-content select="[filters]"></ng-content>
              <ng-content></ng-content>
            </div>
            <div class="col-auto">
              <button
                type="button"
                class="btn btn-primary"
                [disabled]="isLoading()"
                (click)="handleSearchButtonClick()"
              >
                @if (isLoading()) {
                  <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                  <span>{{ es.search.searchingButtonText }}</span>
                } @else {
                  <span>{{ es.search.searchButtonText }}</span>
                }
              </button>
            </div>
          </div>

          @if (isLoading()) {
            <div class="text-center py-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">{{ es.search.loadingMessage }}</span>
              </div>
            </div>
          } @else if (items() && items()!.length > 0) {
            <div class="table-responsive">
              <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    @if (headerTemplate()) {
                      <ng-container *ngTemplateOutlet="headerTemplate()"></ng-container>
                    }
                  </tr>
                </thead>
                <tbody>
                  @for (item of items()!; track $index) {
                    <tr style="cursor: pointer;" (click)="selectItem(item)">
                      @if (rowTemplate()) {
                        <ng-container
                          *ngTemplateOutlet="rowTemplate()!; context: { $implicit: item }"
                        ></ng-container>
                      }
                    </tr>
                  }
                </tbody>
              </table>
            </div>
            <app-pager
              [page]="currentPage()"
              [totalPages]="totalPages()"
              (pageChange)="onPageChanged($event)"
            />
          } @else if (hasSearched()) {
            <div class="alert alert-info text-center my-3 mb-0" role="alert">
              {{ es.search.noResultsMessage }}
            </div>
          }
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">
            {{ es.search.closeButtonText }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
